# risk/limits.yaml — SINGLE SOURCE OF TRUTH for all risk parameters.
# Edited by hand ONLY. No LLM/agent may write this file (see CLAUDE.md §"Self-improvement").
# Per-trade rule: per-trade $ risk = (risk_index.table[RI].per_trade_pct / 100) * CURRENT equity,
# recomputed on every trade so profits and deposits auto-compound the next position's size.

meta:
  description: "TradeForge risk dial, conviction tiering, milestone ratchet, program-abort, cost floor."
  per_trade_rule: "per_trade_$ = (per_trade_pct/100) * current_equity, recomputed each trade"

risk_index:
  default: 5            # current FLOOR; ramps toward 8 by manual, gated decision (never auto-tuned from live P&L)
  band: [5, 8]          # operating band; 1-4 and 9-10 are reference rows only
  table:
    1:  {per_trade_pct: 0.25, max_concurrent: 1, daily_halt_pct: 1.00, weekly_halt_pct: 3.0,  portfolio_heat_pct: 1.0, leverage_max: 1.0,  options: none,               reference_only: true}
    2:  {per_trade_pct: 0.40, max_concurrent: 1, daily_halt_pct: 1.25, weekly_halt_pct: 3.5,  portfolio_heat_pct: 1.5, leverage_max: 1.0,  options: none,               reference_only: true}
    3:  {per_trade_pct: 0.55, max_concurrent: 2, daily_halt_pct: 1.50, weekly_halt_pct: 3.5,  portfolio_heat_pct: 2.0, leverage_max: 1.0,  options: none,               reference_only: true}
    4:  {per_trade_pct: 0.75, max_concurrent: 2, daily_halt_pct: 1.50, weekly_halt_pct: 4.0,  portfolio_heat_pct: 2.5, leverage_max: 1.0,  options: minimal,            reference_only: true}
    5:  {per_trade_pct: 1.00, max_concurrent: 3, daily_halt_pct: 2.00, weekly_halt_pct: 5.0,  portfolio_heat_pct: 3.0, leverage_max: 1.0,  options: defined_risk_small}
    6:  {per_trade_pct: 1.25, max_concurrent: 3, daily_halt_pct: 2.50, weekly_halt_pct: 6.0,  portfolio_heat_pct: 4.0, leverage_max: 1.5,  options: ok}
    7:  {per_trade_pct: 1.50, max_concurrent: 4, daily_halt_pct: 3.00, weekly_halt_pct: 7.0,  portfolio_heat_pct: 5.0, leverage_max: 2.0,  options: ok}
    8:  {per_trade_pct: 2.00, max_concurrent: 4, daily_halt_pct: 3.50, weekly_halt_pct: 8.0,  portfolio_heat_pct: 6.0, leverage_max: null, options: ok}   # null = up to broker intraday max
    9:  {per_trade_pct: 2.50, max_concurrent: 5, daily_halt_pct: 4.00, weekly_halt_pct: 10.0, portfolio_heat_pct: 7.0, leverage_max: null, options: ok, reference_only: true}
    10: {per_trade_pct: 3.00, max_concurrent: 6, daily_halt_pct: 4.50, weekly_halt_pct: 12.0, portfolio_heat_pct: 8.0, leverage_max: null, options: ok, reference_only: true}

# Setup grade -> base RI (then clamped to [risk_index.default floor, 8] at runtime).
conviction_tiers:
  B: 5
  A: 6            # A flexes 6-7; base 6, 7 reserved for the strongest A setups as the floor ramps
  "A+": 8

# Milestone ratchet: at each milestone reached, sweep `sweep_fraction` of gains (vs the last
# protected baseline) into a vault sleeve the aggressive engine cannot touch.
ratchet:
  starting_capital: 1000
  sweep_fraction: 0.25
  milestones: [2500, 5000, 10000, 25000, 50000, 100000]
  vault_sleeve: untouchable_by_aggressive_engine

# Program-abort: NOT on the risk dial, always on. Insurance against bugs/disconnects/death-spirals.
program_abort:
  monthly_review_drawdown_pct: 20   # -20% in a calendar month -> mandatory review
  peak_halt_drawdown_pct: 35        # -35% from all-time equity high -> halt + manual restart
  on_risk_dial: false

# Small-account cost-viability floor: when costs threaten expectancy, RAISE SELECTIVITY, never widen risk.
cost_viability:
  min_edge_to_cost_ratio: 2.0       # require expected edge >= 2x modeled round-trip cost to take a trade
  response: raise_selectivity       # tighten setup grade / cut frequency
  never_widen_risk: true
