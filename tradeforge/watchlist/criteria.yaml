# watchlist/criteria.yaml — universe selection criteria. Tiers: CORE (live), ACTIVE (paper), SCOUT (observe).
#
# Each tier has liquidity/price gates AND a per-strategy level-respect gate
# (require_score): a symbol earns a tier only if its best level-respect score
# (the ~90-day replay mini-backtest, watchlist/level_respect.py) clears the gate.
# CORE additionally passes a CORRELATION CHECK (require_correlation_check): a
# candidate is admitted to CORE only if its daily-return correlation to every
# current CORE member is below core_max_correlation — so CORE stays genuinely
# diversified (don't fill it with three SPY proxies; MASTER_PLAN.md §4).
tiers:
  CORE:   {max_symbols: 4,  min_dollar_volume: 50000000, min_price: 5, require_score: 0.55}
  ACTIVE: {max_symbols: 8,  min_dollar_volume: 20000000, min_price: 3, require_score: 0.45}
  SCOUT:  {max_symbols: 25, min_dollar_volume: 5000000,  min_price: 1, require_score: 0.0}

# Fallback per-strategy fit gate if a tier omits require_score.
require_level_respect_score: 0.0

# CORE diversification: admit at most ONE CORE name per correlation CLUSTER
# (single-linkage union-find on daily-return correlation, shared with the Phase-1
# portfolio engine via watchlist/clustering.py). corr_cluster_threshold is the
# |rho| at/above which two names collapse into one cluster; it replaces the old
# O(n^2) pairwise reject (core_max_correlation is kept as the back-compat default
# for the threshold). require_correlation_check toggles the whole check.
require_correlation_check: true
core_max_correlation: 0.85
corr_cluster_threshold: 0.85

# ---- metadata gates (from watchlist/fetch_metadata.equity_metadata, MCP-fetched
# off the hot path). A gate is NON-BINDING when its metadata is absent for a
# symbol, so run_weekly works before the first refresh. Set globally; a tier may
# override any key under its own block. ----
max_spread_bps: 50               # reject names whose bid/ask spread exceeds this (bps)
min_price_history_sessions: 252  # require >= ~1y of traded sessions (computed from bars)
fractional_required: false       # require fractional eligibility (true for a small book)

# Per-tier sector-concentration cap: at most this FRACTION of a tier's max_symbols
# may share one sector (so CORE can't be three Tech names). Non-binding when a
# symbol's sector is unknown.
sector_max_concentration: 0.5
