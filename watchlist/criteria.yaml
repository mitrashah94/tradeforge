# watchlist/criteria.yaml — universe selection criteria. Tiers: CORE (live), ACTIVE (paper), SCOUT (observe).
tiers:
  CORE:   {max_symbols: 4,  min_dollar_volume: 50000000, min_price: 5}
  ACTIVE: {max_symbols: 8,  min_dollar_volume: 20000000, min_price: 3}
  SCOUT:  {max_symbols: 25, min_dollar_volume: 5000000,  min_price: 1}
require_level_respect_score: 0.0   # per-strategy fit gate (set per strategy later)
require_correlation_check: true
