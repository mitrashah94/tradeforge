[project]
name = "tradeforge"
version = "0.0.1"
description = "Autonomous, self-improving systematic trading platform"
requires-python = ">=3.11"
dependencies = [
  "claude-agent-sdk",
  "duckdb>=1.0",
  "pandas>=2.0",
  "pyarrow>=15.0",
  "vectorbt>=0.26",
  "alpaca-py>=0.20",
  "polygon-api-client>=1.14",
  "pydantic>=2.5",
  "pyyaml>=6.0",
  "rich>=13.0",
  "apscheduler>=3.10",
  "mplfinance>=0.12",
  "plotly>=5.20",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
# Kronos forecasting overlay (Phase 3) — OPTIONAL. The core platform imports and
# runs without these; only forecast/kronos/predictor's live model needs them
# (the leakage guard, store, and engine consumption work with a seeded table).
# Install with: pip3 install 'tradeforge[ml]'
ml = ["torch>=2.2", "einops>=0.7", "huggingface_hub>=0.20", "safetensors>=0.4"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["orchestrator", "risk", "strategies", "backtest", "watchlist", "orderbook", "reporting", "audit", "portfolio", "forecast"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
